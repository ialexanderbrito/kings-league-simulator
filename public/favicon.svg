  <!-- Brilho no topo -->
  <path d="M8.5 7.2L16 4.4L23.5 7.2" stroke="#FFFFFF" stroke-width="0.7" stroke-linecap="round" opacity="0.3"/>

  <!-- Coroa Pure Crown interna com diamante vazado -->
  <path fill-rule="evenodd" clip-rule="evenodd" d="M8.5 11.5L12 18.5L16 8.5L20 18.5L23.5 11.5L21.5 20.5H10.5L8.5 11.5ZM16 11.8L17.5 14.5L16 17.2L14.5 14.5L16 11.8Z" fill="url(#fav-crown)" stroke="#FFFBEB" stroke-width="0.4" stroke-linejoin="round"/>

  <!-- Pedestal base -->
  <rect x="9.5" y="22" width="13" height="1.8" rx="0.9" fill="url(#fav-crown)"/>
  <rect x="11" y="22.3" width="10" height="0.6" rx="0.3" fill="#FFFFFF" opacity="0.4"/>
